server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Kompresja
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml font/woff2;

    # Healthcheck
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Zasoby z hashem w nazwie — cache na długo (immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API — proxy do usługi `api` (ten sam origin, więc ciasteczko sesji działa
    # bez CORS). Nazwa `api` pochodzi z sieci docker compose.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream api:4000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA: każde nieznane żądanie kieruj do index.html (routing po stronie klienta)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Podstawowe nagłówki bezpieczeństwa
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # index.html bez cache — zawsze świeży manifest
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
